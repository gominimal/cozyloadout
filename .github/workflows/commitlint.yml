# Conventional Commits, enforced on the commits in a PR. The convention was
# documented in CONTRIBUTING.md long before anything checked it.
name: commitlint

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 so the action can see every commit in the range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@v6
