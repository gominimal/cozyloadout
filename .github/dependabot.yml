version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A week's soak before taking a new release, so a yanked or compromised
    # version is caught upstream before it lands here.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # The renderer is the only Cargo project, and it is not at the repo root.
  - package-ecosystem: "cargo"
    directory: "/tools/cozy-theme"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
