[package]
name = "cozy-theme"
version = "0.1.0"
edition = "2021"

# Declared so an older toolchain fails with "requires rustc 1.85" rather than a
# confusing parse error. The floor is set by the dependencies, not by this
# crate's own code: uuid 1.26, indexmap 2.14 and hashbrown 0.17 all want 1.85.
# (Before the deps landed it was 1.71, for `[char; N]`'s Pattern impl in
# `split_kv` — that is still the floor the crate's own source needs.)
rust-version = "1.85"

# The tool used to have no dependencies at all, so `just theme` built with
# nothing but a rustc/cargo pair. That is over: a setup wizard is coming and
# will pull in ratatui, so the offline-buildable property was going to go
# regardless, and hand-rolled parsers are not worth keeping to defend it.
#
# `toml` replaces ~95 lines of hand-rolled TOML subset for templates/manifest.toml.
# `uuid` replaces a hand-rolled hash that stamped a version-4 nibble onto a
# deterministic value; v5 is what a name-derived UUID actually is.
#
# The scheme YAML parser is still hand-rolled, deliberately: it ignores nesting
# so one code path covers both the current and legacy scheme formats, and the
# obvious crate for it (serde_yaml) is archived.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v5"] }

[profile.release]
opt-level = 1
