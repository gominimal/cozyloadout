[package]
name = "cozy-theme"
version = "0.1.0"
edition = "2021"

# No dependencies on purpose: the scheme format is a flat map and the template
# grammar is four constructs, so hand-rolling both keeps `just theme` buildable
# with nothing but a rustc/cargo pair — no registry fetch, no vendor directory.
[dependencies]

[profile.release]
opt-level = 1
