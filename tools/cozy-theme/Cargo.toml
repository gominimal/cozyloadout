[package]
name = "cozy-theme"
version = "0.1.0"
edition = "2021"

# Declared so an older toolchain fails with "requires rustc 1.85" rather than a
# confusing parse error. The floor is set by the dependencies, not by this
# crate's own code: uuid 1.26, indexmap 2.14 and hashbrown 0.17 all want 1.85.
# (Before the deps landed it was 1.71, for `[char; N]`'s Pattern impl in
# `split_kv` — that is still the floor the crate's own source needs.)
rust-version = "1.85"

# The tool used to have no dependencies at all, so `just theme` built with
# nothing but a rustc/cargo pair. That is over: a setup wizard is coming and
# will pull in ratatui, so the offline-buildable property was going to go
# regardless, and hand-rolled parsers are not worth keeping to defend it.
#
#   yaml-rust2  the scheme parser. Replaces a hand-rolled line splitter whose
#               whole reason for existing was quoting hazards. `default-features
#               = false` drops encoding_rs: it only handles non-UTF-8 input, and
#               `read_to_string` already requires UTF-8. Zero `unsafe`, unlike
#               the serde_yaml forks' transpiled-C backend.
#   minijinja   the template engine. Note this is why placeholders are
#               snake_case — Jinja parses `base00-hex` as a subtraction.
#   toml+serde  templates/manifest.toml, and validating generated .toml output.
#   roxmltree   validating generated .tmTheme output. Chosen over quick-xml,
#               which accepts `--` inside an XML comment without complaint —
#               that exact malformation shipped in every theme once already.
#   uuid        v5 theme UUIDs; a name-derived UUID is what v5 *is*.
#   clap        the CLI, derive form, ahead of the wizard's subcommands.
#   color-eyre  error reports.
#   fs-err      puts the path in io errors so call sites stop doing it by hand.
[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
fs-err = "3.3.1"
minijinja = "2.24.0"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v5"] }
yaml-rust2 = { version = "0.12.0", default-features = false }

# Pedantic clippy, repo-wide, so `cargo clippy` needs no flags and CI picks it
# up for free. priority = -1 lets individual lints below override the group.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 1
