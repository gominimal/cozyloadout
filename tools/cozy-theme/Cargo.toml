[package]
name = "cozy-theme"
version = "0.1.0"
edition = "2021"
# The repository's licence, declared so the supply-chain audit can see it — an
# undeclared licence is indistinguishable from an incompatible one. Not
# published: this is a build tool for this repo, not a crates.io artifact.
license = "Apache-2.0"
publish = false
# Two binaries live here: the renderer and the wizard. Without this, a bare
# `cargo run` cannot choose between them and fails — which is exactly what
# `just render` does under the hood.
default-run = "cozy-theme"

# Declared so an older toolchain fails with "requires rustc 1.88" rather than a
# confusing parse error. The floor is set by the dependencies, not by this
# crate's own code — currently `darling`, reached through ratatui. It has moved
# twice already (1.71 -> 1.85 when the parsers landed, 1.85 -> 1.88 with
# ratatui), which is why CI compiles against it rather than trusting it.
rust-version = "1.88"

# The tool used to have no dependencies at all, so `just theme` built with
# nothing but a rustc/cargo pair. That is over: a setup wizard is coming and
# will pull in ratatui, so the offline-buildable property was going to go
# regardless, and hand-rolled parsers are not worth keeping to defend it.
#
#   yaml-rust2  the scheme parser. Replaces a hand-rolled line splitter whose
#               whole reason for existing was quoting hazards. `default-features
#               = false` drops encoding_rs: it only handles non-UTF-8 input, and
#               `read_to_string` already requires UTF-8. Zero `unsafe`, unlike
#               the serde_yaml forks' transpiled-C backend.
#   minijinja   the template engine. Note this is why placeholders are
#               snake_case — Jinja parses `base00-hex` as a subtraction.
#   toml+serde  templates/manifest.toml, and validating generated .toml output.
#   roxmltree   validating generated .tmTheme output. Chosen over quick-xml,
#               which accepts `--` inside an XML comment without complaint —
#               that exact malformation shipped in every theme once already.
#   uuid        v5 theme UUIDs; a name-derived UUID is what v5 *is*.
#   clap        the CLI, derive form, ahead of the wizard's subcommands.
#   color-eyre  error reports.
#   fs-err      puts the path in io errors so call sites stop doing it by hand.
[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
fs-err = "3.3.1"
# The `/` filter on the theme and patches screens. Skim's Sublime-style
# scorer: a subsequence match is easy, but the *ranking* is the part that
# decides whether the filter feels right, and that is worth not hand-rolling.
#
# MIT. `nucleo-matcher` is the better-known one and is MPL-2.0, which
# deny.toml's allowlist deliberately excludes — that would be the first
# copyleft in the tree, and it is not a decision to make in passing.
fuzzy-matcher = "0.3.7"
minijinja = "2.24.0"
ratatui = "0.29.0"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
# Reading the package index `min` already caches on disk. Already in the tree
# via cargo-deny's own dependencies; direct here because the wizard parses it.
serde_json = "1"
# Syntax highlighting for the patches preview. Narrow feature set on purpose:
# the parser and the plist loader, a pure-Rust regex engine, and none of
# syntect's own syntaxes or themes. The colours come from the .tmTheme this repo
# already generates, so a previewed file is lit exactly as `bat` will light it.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "plist-load",
] }
# The grammars, which are `bat`'s own set. syntect's bundled 75 have no TOML in
# them, and TOML is the most common thing on the patches page by some way.
# `syntect-fancy` rather than the default: that pulls in oniguruma, a C library,
# and nothing else here needs a C toolchain to build.
two-face = { version = "0.4.3", default-features = false, features = [
    "syntect-fancy",
] }
toml = "0.8"
# Already in the lock as toml's own parser. Direct because the wizard edits a
# config file the user may have hand-written: `toml` would round-trip it
# through a value tree and drop their comments, `toml_edit` does not.
toml_edit = "0.22.27"
uuid = { version = "1", features = ["v5"] }
yaml-rust2 = { version = "0.12.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
# Archive previews: what patching a `.zip` or `.tar.gz` in would bring. flate2
# was already in the tree via syntect, so gzip costs nothing extra.
flate2 = "1.1.10"

# Pedantic clippy, repo-wide, so `cargo clippy` needs no flags and CI picks it
# up for free. priority = -1 lets individual lints below override the group.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Pedantic's library-API lints, switched off for the shared lib. It exists so
# the renderer and the wizard can share a scheme parser inside one package, not
# as something published — `publish = false` above. Writing `# Errors` and
# `# Panics` sections and `#[must_use]` for callers who are both in this repo
# is documentation nobody reads. Everything else pedantic says still applies.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 1
