# GENERATED by `just theme` from schemes/{{scheme-slug}}.yaml — see AGENTS.md.
# Edit templates/lazygit/config.yml instead.
#
# lazygit reads $XDG_CONFIG_HOME/lazygit/config.yml. Unlike broot, an
# unrecognised *key* here is a hard startup error (lazygit unmarshals with known
# fields only), so this file sticks to keys verified against v0.64.1's
# user_config.go — the version the MPR pins. An unrecognised colour *value*, on
# the other hand, is silently dropped: theme.GetTextStyle falls through when a
# key is neither an attribute name, a name in ColorMap, nor a valid hex value.
# So a typo in a hex triplet below shows up as an unstyled widget, not a
# message. That is broot's failure mode, and it is worth knowing about here too.

gui:
  # Every value is a list of strings — lazygit merges attributes ("bold",
  # "reverse", "underline", "strikethrough") with at most one colour. Hex is
  # written `#rrggbb`, which utils.IsValidHexValue accepts alongside the ANSI
  # names; hex is used for the same reason fish sets hex rather than ANSI names.
  theme:
    activeBorderColor:
      - "#{{base0D-hex}}" # the accent helix gives headings and zellij the active ribbon
      - bold
    inactiveBorderColor:
      - "#{{base03-hex}}" # the same dim slot as comments and invisibles
    searchingActiveBorderColor:
      - "#{{base0A-hex}}" # yellow, matching fish's and helix's search highlight
      - bold
    optionsTextColor:
      - "#{{base04-hex}}" # secondary text, for the keybinding line
    defaultFgColor:
      - "#{{base05-hex}}" # default foreground
    unstagedChangesColor:
      - "#{{base08-hex}}" # red
    # Backgrounds. base02 is the selection slot the rest of the loadout uses
    # (fish_color_selection, helix's ui.selection); base01 is the lighter
    # surface, dim enough to read as "selected, but not the focused panel".
    selectedLineBgColor:
      - "#{{base02-hex}}"
    inactiveViewSelectedLineBgColor:
      - "#{{base01-hex}}"
    cherryPickedCommitFgColor:
      - "#{{base0C-hex}}"
    cherryPickedCommitBgColor:
      - "#{{base01-hex}}"
    markedBaseCommitFgColor:
      - "#{{base0A-hex}}"
    markedBaseCommitBgColor:
      - "#{{base01-hex}}"

git:
  # 0.64 replaced the old `git.paging` block with a list of renderers that the
  # `|` key cycles through. Both entries are tools the loadout already ships, so
  # neither is a new dependency:
  #
  #   delta       a stdinFilter — it post-processes git's own diff, hooked up
  #               through GIT_PAGER. It reads [delta] out of git config, which
  #               the on_activate hook points at the loadout's include, so it
  #               arrives already wearing the scheme and takes its syntax
  #               highlighting from the same bat theme cache that hook builds.
  #   difftastic  an extDiff — it replaces git's diff generation entirely via
  #               `diff.external`, which is why it must NOT be a stdinFilter:
  #               difft takes file paths, not a unified diff on stdin. It is
  #               structural rather than line-based, so it earns a second slot
  #               rather than replacing delta.
  #
  # Order matters: the first entry is what lazygit starts with.
  #
  # Upstream's difftastic example passes a `diffContext` template variable to
  # difft's --context flag, and it is deliberately dropped here: lazygit spells
  # its template variables with the same doubled braces cozy-theme uses for
  # placeholders, so it would be resolved at render time — as an unknown
  # placeholder, which is a hard error — long before lazygit ever saw it. The
  # grammar has no escape. The cost is that `{`/`}` resize the diff context for
  # delta but not for difft, which uses its own default. See AGENTS.md,
  # "Format footguns".
  diffRenderers:
    - name: delta
      type: stdinFilter
      colorArg: always
      command: delta {{#dark}}--dark{{/dark}}{{#light}}--light{{/light}} --paging=never
    - name: difftastic
      type: extDiff
      command: difft --color=always
