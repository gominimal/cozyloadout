# {{scheme_name}} — starship.
#
# GENERATED by `just theme` from schemes/{{scheme_slug}}.yaml.
# Edit templates/starship/starship.toml instead; see AGENTS.md.
#
# This file only restyles starship; it deliberately does not set `format`, so
# the prompt keeps starship's default shape and module set. Every module that
# ships a coloured default is reassigned to a base16 slot here, so nothing is
# left tracking the terminal emulator's own 16-colour table — the same reasoning
# behind fish setting hex explicitly.
#
# Slot names are lowercase here (base0a, not base0A as in the helix theme and
# the scheme YAML): starship lowercases a style string before looking it up in
# the palette, so an uppercase palette key can never be referenced and the
# module silently renders unstyled.
#
# Slot conventions used below:
#   base0d blue   — where you are (directory, containers, C-family)
#   base0a yellow — VCS branch, packaging, types-ish tooling
#   base09 orange — VCS state, clouds, "something is in progress"
#   base08 red    — errors, root, dirty worktree, JVM/Ruby family
#   base0b green  — success, JS/green-field runtimes
#   base0c cyan   — identity, orchestration, ML/systems runtimes
#   base0e purple — shells, functional languages, IaC
#   base0f brown  — the leftovers that would otherwise collide

palette = "{{scheme_slug}}"

# --- Palette -----------------------------------------------------------------
[palettes.{{scheme_slug}}]
base00 = "#{{base00_hex}}" # default background
base01 = "#{{base01_hex}}" # lighter surface
base02 = "#{{base02_hex}}" # selection
base03 = "#{{base03_hex}}" # comments, dim text
base04 = "#{{base04_hex}}" # secondary text
base05 = "#{{base05_hex}}" # default foreground
base06 = "#{{base06_hex}}" # light foreground (rare)
base07 = "#{{base07_hex}}" # lightest (rare)
base08 = "#{{base08_hex}}" # red
base09 = "#{{base09_hex}}" # orange
base0a = "#{{base0A_hex}}" # yellow
base0b = "#{{base0B_hex}}" # green
base0c = "#{{base0C_hex}}" # cyan
base0d = "#{{base0D_hex}}" # blue
base0e = "#{{base0E_hex}}" # purple
base0f = "#{{base0F_hex}}" # brown

# --- Prompt character --------------------------------------------------------
[character]
success_symbol = "[❯](bold base0b)"
error_symbol = "[❯](bold base08)"
vimcmd_symbol = "[❮](bold base0e)"
vimcmd_replace_one_symbol = "[❮](bold base0e)"
vimcmd_replace_symbol = "[❮](bold base0e)"
vimcmd_visual_symbol = "[❮](bold base0a)"

# --- Location ----------------------------------------------------------------
[directory]
style = "bold base0d"
read_only_style = "base08"
repo_root_style = "bold base0d"

[shlvl]
style = "bold base0a"

[fill]
style = "base02"

# --- Identity ----------------------------------------------------------------
[username]
style_user = "bold base0c"
style_root = "bold base08"

[hostname]
style = "bold base0c"

[localip]
style = "bold base0c"

[shell]
style = "bold base0e"

[sudo]
style = "bold base08"

[container]
style = "bold base0d"

[os]
style = "bold base04"

[singularity]
style = "bold base0e"

