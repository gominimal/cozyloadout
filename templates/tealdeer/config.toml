# GENERATED by `just theme` from schemes/{{scheme_slug}}.yaml — see AGENTS.md.
# Edit templates/tealdeer/config.toml instead.
#
# tealdeer reads $XDG_CONFIG_HOME/tealdeer/config.toml — the directory is named
# after the crate, not after the `tldr` command. (Versions before 1.5 used
# ~/.config/tldr; the MPR pins 1.8.1, which does not.)
#
# Unknown keys are ignored rather than rejected — RawConfig carries
# `#[serde(default)]` and no `deny_unknown_fields` — so a mistyped section name
# here shows up as an unstyled page, not a message. Same failure mode as broot.

# --- Colours ---------------------------------------------------------------
# Colours are an externally-tagged enum: `{ rgb = { r = …, g = …, b = … } }` is
# the truecolour form, and the bare names (`red`, `cyan`, …) map to the ANSI
# table. The rgb form is used for the same reason fish sets hex rather than ANSI
# names — the 16-colour table is on-scheme, but this doesn't depend on it.
#
# `bold`, `underline` and `italic` all default to false, so each block sets only
# what it needs.

# The command the page is about, printed as the title.
[style.command_name]
foreground = { rgb = { r = {{base0D_rgb_r}}, g = {{base0D_rgb_g}}, b = {{base0D_rgb_b}} } }
bold = true

# The one-line summary under the title.
[style.description]
foreground = { rgb = { r = {{base05_rgb_r}}, g = {{base05_rgb_g}}, b = {{base05_rgb_b}} } }

# The prose introducing each example ("- Extract an archive:").
[style.example_text]
foreground = { rgb = { r = {{base04_rgb_r}}, g = {{base04_rgb_g}}, b = {{base04_rgb_b}} } }

# The runnable line itself.
[style.example_code]
foreground = { rgb = { r = {{base0B_rgb_r}}, g = {{base0B_rgb_g}}, b = {{base0B_rgb_b}} } }

# The {placeholders} inside a runnable line — the parts you have to substitute
# before the command means anything. Underlined as well as coloured, because
# "this is not literal" is the one distinction on the page worth carrying
# without relying on colour.
[style.example_variable]
foreground = { rgb = { r = {{base09_rgb_r}}, g = {{base09_rgb_g}}, b = {{base09_rgb_b}} } }
underline = true

# --- Behaviour -------------------------------------------------------------
[display]
# Blank lines between examples. tldr pages are short and a zellij pane is not,
# so the spacing is worth more than the lines it costs.
compact = false

# Leave the pager off. $PAGER is bat, and a page that fits on screen does not
# want a pager between it and you.
use_pager = false

[updates]
# tealdeer ships no pages: `tldr <cmd>` on a cold cache is an error until
# something populates it. A session sandbox always starts cold, so without this
# the tool is broken on arrival in every new session.
#
# Left to the first invocation rather than done in the on_activate hook
# deliberately. The hook must exit 0 on every path and is timeout-capped (60s by
# default), so putting a network fetch of the full tldr archive in it trades a
# working `tldr` for a risk of an unattachable session. Fetching on first use
# costs a pause the first time you run it and nothing afterwards.
#
# Needs egress and a trust store; `ca-certificates` is in the package list.
auto_update = true
auto_update_interval_hours = 720 # 30 days, tealdeer's own default
