# {{scheme-name}} — bottom.
#
# GENERATED by `just theme` from schemes/{{scheme-slug}}.yaml.
# Edit templates/bottom/bottom.toml instead; see README.md.
#
# Only [styles] is set here, so bottom's layout, refresh rate and widget
# defaults are untouched — this is a colour scheme, not a configuration.
#
# bottom has no palette indirection and no theme name of its own, so unlike
# every other tool in the loadout the scheme is baked into the config file
# itself and the filename stays fixed.
#
# Note that bottom names these keys with British spellings internally — its
# error messages say `border_colour` where the config key is `border_color`.
# Both spellings are accepted; `color` is used here to match bottom's docs.

# --- Chrome ------------------------------------------------------------------
[styles.widgets]
border_color = "#{{base02-hex}}"                                    # base02 — --border
selected_border_color = "#{{base0D-hex}}"                           # base0D — focused widget, as in zellij's frame_selected
widget_title = { color = "#{{base05-hex}}", bold = true }           # base05
text = { color = "#{{base05-hex}}" }                                # base05
selected_text = { color = "#{{base00-hex}}", bg_color = "#{{base0D-hex}}" } # base00 on base0D
disabled_text = { color = "#{{base03-hex}}" }                       # base03
thread_text = { color = "#{{base04-hex}}" }                         # base04

[styles.tables]
headers = { color = "#{{base0D-hex}}", bold = true }                # base0D — matches zellij's table_title

[styles.graphs]
graph_color = "#{{base02-hex}}"                                     # base02 — axes and grid
legend_text = { color = "#{{base04-hex}}" }                         # base04

# --- CPU ---------------------------------------------------------------------
[styles.cpu]
all_entry_color = "#{{base05-hex}}"                                 # base05
avg_entry_color = "#{{base08-hex}}"                                 # base08
# Per-core series. Same order as zellij's multiplayer_user_colors, so a machine
# with many cores cycles through the accents in a familiar sequence.
cpu_core_colors = [
  "#{{base0D-hex}}", # base0D
  "#{{base0B-hex}}", # base0B
  "#{{base09-hex}}", # base09
  "#{{base0E-hex}}", # base0E
  "#{{base0C-hex}}", # base0C
  "#{{base0A-hex}}", # base0A
  "#{{base08-hex}}", # base08
  "#{{base0F-hex}}", # base0F
]

# --- Memory ------------------------------------------------------------------
[styles.memory]
ram_color = "#{{base0D-hex}}"                                       # base0D
cache_color = "#{{base0E-hex}}"                                     # base0E
swap_color = "#{{base09-hex}}"                                      # base09
arc_color = "#{{base0C-hex}}"                                       # base0C
gpu_colors = [
  "#{{base0B-hex}}", # base0B
  "#{{base0A-hex}}", # base0A
  "#{{base08-hex}}", # base08
  "#{{base0F-hex}}", # base0F
]

# --- Network -----------------------------------------------------------------
[styles.network]
rx_color = "#{{base0B-hex}}"                                        # base0B — incoming
tx_color = "#{{base0D-hex}}"                                        # base0D — outgoing
rx_total_color = "#{{base0C-hex}}"                                  # base0C
tx_total_color = "#{{base0E-hex}}"                                  # base0E

# --- Gauges ------------------------------------------------------------------
[styles.battery]
high_battery_color = "#{{base0B-hex}}"                              # base0B — --success
medium_battery_color = "#{{base0A-hex}}"                            # base0A
low_battery_color = "#{{base08-hex}}"                               # base08 — --error

[styles.temp_graph]
# Cool → hot, walking the same green/yellow/orange/red accents broot's
# good_to_bad ramp uses.
temp_graph_color_styles = [
  "#{{base0B-hex}}", # base0B
  "#{{base0A-hex}}", # base0A
  "#{{base09-hex}}", # base09
  "#{{base08-hex}}", # base08
]
