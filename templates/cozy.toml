# GENERATED by `just theme` from schemes/{{scheme-slug}}.yaml — see AGENTS.md.
# Edit templates/cozy.toml (packages, vars) or templates/manifest.toml
# (the patches list) instead.

# No `name`: a loadout is identified by its filename stem, so this file being
# installed as loadouts/{{loadout-name}}.toml is what names it. The field is
# obsolete — a file that still carries one loads with a warning that it is no
# longer required, and the filename wins regardless.
description = "A cozy developer setup — {{scheme-name}}"

packages = [
  "fish",
  "starship",
  "zellij",
  "helix",
  "bat",
  "broot",
  "delta",
  "fd",
  "ripgrep",
  "eza",
  "git",
  "procs",
  "bottom",
  "glow",
  "zoxide",
  "claude-code",
  "fzf",
  "sd",
  "less",
  "coreutils",
  "inetutils",
  "iproute2",
  "procps-ng",
  "man-db",
  "zip",
  "unzip",
  "jq",
  "patch",
  "rsync",
  "openssh",
  "ca-certificates",
  "atuin",
  "tealdeer",
  "dust",
  "duf",
  "hexyl",
  "util-linux",
  "tokei",
  "hyperfine",
  "bandwich",
  "gh",
  "grep",
  "sed",
  "awk",
  "findutils",
  "tar",
  "gzip",
  "lazygit",
  "difftastic",
]

# The patches list is generated from templates/manifest.toml, so it can never
# fall out of step with what was actually rendered into cozy/.
patches = [
{{patches}}
]

# Vars compose across every contributor, and the same name with a *different*
# value is a hard conflict that fails activation — there is no precedence
# between a loadout and the project. So a project whose `minimal.toml` sets
# EDITOR to anything but `hx` will not activate alongside this loadout; the way
# out is the user policy's `ignore` list, which drops all contributors of a name.
[vars]
SHELL  = "fish"
EDITOR = "hx"
PAGER  = "bat"

# Hand `min attach` over to fish, which in turn auto-starts zellij.
#
# Lifecycle hooks do NOT replace this, though they look like they should. The
# session shell is `bash --noprofile --rcfile <daemon rc> -i`; it reads none of
# your startup files (the one rc it does read is the daemon's own, which installs
# the DEBUG trap that keeps TERM current), and there is no documented way to
# choose what you land in. Nor can a hook stand in for it: a hook is a separate
# process the daemon spawns against the session's pty, not the shell you are
# talking to, and it is timeout-capped at 60s by default and 300s at most. The
# loadouts reference says as much: "Interactive setup happens through
# environment variables instead."
#
# PROMPT_COMMAND is that environment variable: bash takes it from the
# environment and evaluates it before drawing the first prompt.
#
# Setting it here replaces the launcher's baseline value, which costs the
# orientation banner and nothing else — TERM is kept current by a daemon-owned
# DEBUG trap that no composition can reach, precisely so that replacing this
# variable stays cheap.
#
# `unset PROMPT_COMMAND` first, for two reasons: it fires once rather than on
# every prompt, and unset drops it from the exported environment too, so the
# fish it execs into — and any bash nested under that — never sees it. No loop.
#
# The `command -v` guard is load-bearing, not defensive dressing. `exec` of a
# missing binary behaves differently depending on where it runs: typed at an
# interactive prompt it prints "not found" and leaves the shell alive, but from
# inside PROMPT_COMMAND it takes the shell down with it (bash 5.3, exit 127).
# Unguarded, a missing fish would mean every attach exits immediately — the
# exact failure the once-only unset is meant to avoid.
#
# Upstream tracking issue for a real interface: minimal#957.
PROMPT_COMMAND = "unset PROMPT_COMMAND; command -v fish >/dev/null && exec fish"

# --- Lifecycle hooks -------------------------------------------------------
# The two steps minimal's patch system can't do. These used to live in the fish
# config behind an exported once-per-session guard, and before that were `just`
# recipes run by hand.
#
# External rather than inline: the scripts are long enough to want comments, and
# an external `value` resolves against the directory beside this file — which is
# the loadout's own `{{loadout-name}}/` directory, where the renderer already
# puts them.
#
# on_activate only. There is deliberately NO on_attach hook: it was tried once
# as a safety net for the bat cache, and the terminal background stopped being
# set while it existed. That was never explained, and it is worth knowing that
# the loadout also had a second bug at the time which produces the same symptom
# on its own — the palette was emitted once per shell, so any attach after the
# first landed unthemed whether a hook existed or not. The fish config now
# re-applies per attach, so re-test from scratch before concluding anything
# about on_attach.
#
# The safety net itself is no longer needed: patches are filesystem mappings
# established when the sandbox is built, and a hook cannot run before there is a
# session leader to run it in, so the .tmTheme is on disk by the time
# on_activate fires. The hook still checks, because the check is one stat.
#
# If `bat --list-themes` inside a fresh session does not list the scheme, that
# assumption is what to re-examine first — and the fix is a rebuild in the fish
# config, NOT an on_attach hook.
[[lifecycle_hooks]]
description = "{{loadout-name}}: point git at delta's include, build bat's theme cache"
on_activate = { type = "external", value = "./hooks/on-activate.sh" }
