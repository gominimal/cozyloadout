# The one file in the loadout that has nothing to do with colours: rust-analyzer
# settings, carried here because they are editor preferences and the editor is
# what this loadout configures. Rendered with `copy = true` — no placeholders, no
# scheme name — so it is byte-identical for every scheme.
#
# rust-analyzer itself is deliberately NOT in the loadout's package list: a
# toolchain belongs to the project that needs it, not to a terminal theme.
# Without it helix simply reports the language server as unavailable, and
# everything else in the loadout is unaffected.
#
# One cost worth knowing: it is a second `dest` under ~/.config/helix, so a
# project or another loadout patching `.config/helix/languages.toml` conflicts
# with this one and fails activation rather than merging.

[[language]]
language-servers = ["rust-analyzer"]
name = "rust"

[language-server.rust-analyzer.config.check]
command = "clippy"

[language-server.rust-analyzer.config.inlayHints.bindingModeHints]
enable = false

[language-server.rust-analyzer.config.inlayHints.closingBraceHints]
minLines = 10

[language-server.rust-analyzer.config.inlayHints.closureReturnTypeHints]
enable = "with_block"

[language-server.rust-analyzer.config.inlayHints.discriminateHints]
enable = "fieldless"

[language-server.rust-analyzer.config.inlayHints.lifetimeElisionHints]
enable = "skip_trivial"

[language-server.rust-analyzer.config.inlayHints.typeHints]
hideClosureInitialization = false

