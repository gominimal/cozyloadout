# What `just theme` renders, and where each result is patched to.
#
# One [[file]] per output. Fields:
#
#   template  path under templates/
#   out       path under the built loadout (build/cozy/...)
#   dest      path relative to $HOME that cozy.toml patches it to.
#             Omit for files that are not patched (nothing at present).
#   copy      true to copy verbatim instead of expanding placeholders.
#             Use for files with no colours and no scheme name in them.
#
# `{slug}` in `out`/`dest` is replaced with the scheme slug, so switching schemes
# renames the theme files rather than leaving a stale name on disk holding the
# wrong colours. `{loadout}` is replaced with the loadout's name (`--loadout`,
# default `cozy`), which is what keeps a renamed loadout from shipping files
# named after this one.
#
# The cozy.toml patches list is generated from `out` + `dest` below, in this
# order, so adding a file here is the only edit needed to ship it.

[[file]]
template = "fish/config.fish"
out      = "fish/config.fish"
dest     = ".config/fish/config.fish"

[[file]]
template = "helix/config.toml"
out      = "helix/config.toml"
dest     = ".config/helix/config.toml"

[[file]]
template = "helix/languages.toml"
out      = "helix/languages.toml"
dest     = ".config/helix/languages.toml"
copy     = true

[[file]]
template = "helix/themes/theme.toml"
out      = "helix/themes/{slug}.toml"
dest     = ".config/helix/themes/{slug}.toml"

[[file]]
template = "zellij/config.kdl"
out      = "zellij/config.kdl"
dest     = ".config/zellij/config.kdl"

[[file]]
template = "zellij/themes/theme.kdl"
out      = "zellij/themes/{slug}.kdl"
dest     = ".config/zellij/themes/{slug}.kdl"

# Lifecycle hook scripts. No `dest`: these are not patched into ~/.config, they
# stay inside the loadout directory, where cozy.toml's external hook values
# resolve against them.
[[file]]
template = "hooks/on-activate.sh"
out      = "hooks/on-activate.sh"

# bat only sees the theme once its cache is rebuilt; the on_activate hook does
# that.
[[file]]
template = "bat/config"
out      = "bat/config"
dest     = ".config/bat/config"

[[file]]
template = "bat/themes/theme.tmTheme"
out      = "bat/themes/{slug}.tmTheme"
dest     = ".config/bat/themes/{slug}.tmTheme"

# delta reads [delta] out of git config, so this is an include rather than a
# gitconfig of its own. The on_activate lifecycle hook points git at it.
[[file]]
template = "delta/delta.gitconfig"
out      = "delta/{loadout}-delta.gitconfig"
dest     = ".config/git/{loadout}-delta.gitconfig"

# git's own settings — conflict style, diff algorithm, move detection, and
# difftastic wired up as `git dft`. A second include rather than more of the
# delta one, so a file named after delta doesn't end up deciding how merge
# conflicts are formatted; the same hook adds both. `copy = true`: no colours
# and no scheme name, so it is identical for every scheme.
[[file]]
template = "git/git.gitconfig"
out      = "git/{loadout}-git.gitconfig"
dest     = ".config/git/{loadout}-git.gitconfig"
copy     = true

[[file]]
template = "starship/starship.toml"
out      = "starship/starship.toml"
dest     = ".config/starship.toml"

[[file]]
template = "broot/conf.hjson"
package  = "broot"
out      = "broot/conf.hjson"
dest     = ".config/broot/conf.hjson"

[[file]]
template = "broot/skins/skin.hjson"
package  = "broot"
out      = "broot/skins/{slug}.hjson"
dest     = ".config/broot/skins/{slug}.hjson"

# bottom has no theme-name concept, so the scheme is baked into the config and
# the filename stays fixed.
[[file]]
template = "bottom/bottom.toml"
out      = "bottom/bottom.toml"
dest     = ".config/bottom/bottom.toml"

# atuin is the second tool after helix with real theme-name indirection: the
# config names a theme and atuin goes looking for `<name>.toml` in themes/. The
# two entries have to move together — config.toml renders {{scheme_slug}} into
# its `[theme] name`, and the theme file renders to {slug}.toml.
[[file]]
template = "atuin/config.toml"
package  = "atuin"
out      = "atuin/config.toml"
dest     = ".config/atuin/config.toml"

[[file]]
template = "atuin/themes/theme.toml"
package  = "atuin"
out      = "atuin/themes/{slug}.toml"
dest     = ".config/atuin/themes/{slug}.toml"

# lazygit has no theme-name concept — colours are inline, like bottom's. It also
# wires up delta and difftastic as diff renderers, both of which the loadout
# ships; delta picks up its own styling from the git include below.
[[file]]
template = "lazygit/config.yml"
package  = "lazygit"
out      = "lazygit/config.yml"
dest     = ".config/lazygit/config.yml"

# tealdeer's directory is named after the crate, not the `tldr` command.
[[file]]
template = "tealdeer/config.toml"
package  = "tealdeer"
out      = "tealdeer/config.toml"
dest     = ".config/tealdeer/config.toml"
