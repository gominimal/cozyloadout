# What the loadout installs, in three groups.
#
# The generated `cozy.toml` carries a flat `packages` list, because that is what
# minimal's loadout schema takes. This file is where the list comes from, split
# so the wizard can offer the optional third to the user and so the reason each
# package is here is written down somewhere.
#
# Declining an optional package drops its config too: manifest entries carry a
# `package`, and the renderer skips the ones whose package was not selected. So
# a tool being themed is no reason for it to be mandatory — atuin, broot,
# lazygit and tealdeer are all themed and all optional.
#
# What makes them safe to drop is that nothing assumes them: the fish config
# guards every tool it touches with `command -q`, and the hook's
# `gen_completion` returns early when a binary is missing. difftastic is in
# `cozy` rather than here for exactly that reason — `templates/git/git.gitconfig`
# wires it up as `git dft`, and a gitconfig alias cannot check whether its
# binary exists, so declining it would leave a broken alias behind.
#
# Adding a package: put it in the group that matches why it is there, run
# `just theme`, and read `build/cozy.toml`. The list is generated, so there is
# no second place to update.

# ---------------------------------------------------------------------------

[base]
title = "Core userland"
about = """
The tools any Linux session needs regardless of which loadout is applied: the \
GNU userland, the things that read manuals and archives, and git. Nothing here \
is about the cozy loadout in particular — a session without these is missing \
parts of a working shell, not parts of a theme.\
"""
packages = [
    "ca-certificates",
    "coreutils",
    "findutils",
    "gawk",       # the package is `gawk`; there is no `awk`
    "git",
    "grep",
    "gzip",
    "inetutils",
    "iproute2",
    "less",
    "man-db",
    "openssh",
    "patch",
    "procps-ng",
    "sed",
    # No `zip` counterpart: the MPR has no zip-creating package, only `unzip`.
    # `tar` covers archive creation.
    "tar",
    "unzip",
    "util-linux",
]

# ---------------------------------------------------------------------------

[cozy]
title = "The cozy terminal"
about = """
What makes a session feel like this loadout rather than a bare shell: the \
shell and multiplexer themselves, the editor and pager, and the search and \
navigation tools the fish config builds its aliases and keybindings around. \
Removing one of these does not make a smaller cozy session, it makes a \
different one.\
"""
packages = [
    "bat",
    "bottom",
    "delta",
    "difftastic",
    "eza",
    "fd",
    "fish",
    "gh",
    "helix",
    "procs",
    "ripgrep",
    "sd",
    "starship",
    "zellij",
    "zoxide",
]

# ---------------------------------------------------------------------------
# Optional. `license` is the `license_spdx` field from the package's definition
# in the Minimal Public Registry (gominimal/pkgs) — copy it from there rather
# than guessing when adding a package; the wizard shows it to the user before
# they install anything.
#
# Everything here is preselected: the full set is what the loadout has
# always installed, so an untouched wizard produces the loadout people already
# have. `default` exists so that can be revisited per package without changing
# any code.

[[optional]]
name = "fzf"
license = "MIT"
about = "Fuzzy finder, wired into fish's history and file widgets."
default = true

