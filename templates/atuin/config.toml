# GENERATED by `just theme` from schemes/{{scheme-slug}}.yaml — see AGENTS.md.
# Edit templates/atuin/config.toml instead.
#
# atuin's history database and its config live in the same directory, but only
# this file and themes/ are patched in — the db is session state and minimal
# builds it fresh, which is the intended behaviour for an ephemeral sandbox.

# Selects themes/{{scheme-slug}}.toml, rendered beside this file by the same
# manifest entry pair. A name with no matching file is not fatal: atuin logs it
# and falls back to the built-in default, so a half-installed loadout degrades
# to unthemed rather than to a broken shell.
[theme]
name = "{{scheme-slug}}"

# --- Preferences, not colours ----------------------------------------------
# In the same spirit as helix/config.toml: the loadout configures the editor it
# ships, so it configures the history search it ships too.

# `compact` drops atuin's outer frame, which reads better in a zellij pane that
# already has a border around it. `auto` picks by terminal height.
style = "compact"

# Lines the search UI occupies when not full-screen. 0 means full-screen.
inline_height = 16

# Show the full command for the highlighted entry — commands long enough to be
# worth recalling are usually long enough to be truncated in the list.
show_preview = true

# Enter runs the selected command; Tab puts it on the command line to edit.
# atuin's default is the opposite, and it is the setting people most often
# report as surprising.
enter_accept = true

# Both default to true and both reach the network. A session sandbox is
# short-lived and usually has no atuin account attached, so the check is a
# startup cost that buys nothing; `auto_sync` does nothing at all until you log
# in. Flip either back if you sync your history.
auto_sync = false
update_check = false
