# GENERATED by `just theme` from schemes/{{scheme-slug}}.yaml — see AGENTS.md.
# Edit templates/atuin/themes/theme.toml instead.
#
# atuin loads a theme by looking for `<name>.toml` in ~/.config/atuin/themes/,
# where `<name>` is whatever `[theme] name` in config.toml asks for. The
# manifest renders this to `{slug}.toml` and config.toml names the same slug, so
# switching schemes moves both halves together rather than leaving a stale file
# holding the wrong colours.
#
# The `name` below is the theme's own declaration. atuin keys its loaded-theme
# cache on the *filename* it was asked for, so this value is not what selects
# the file — but a mismatch is confusing to read, so it tracks the slug too.
[theme]
name = "{{scheme-slug}}"

# Keys are the `Meaning` enum spelled exactly as Rust declares it — PascalCase.
# The camelCase in atuin's own source is a `strum` Display impl used for log
# messages, not the serde representation, so `alertInfo` here would be a
# deserialisation error rather than a silent miss.
#
# A meaning left out falls back (Guidance and Annotation to AlertInfo, Title to
# Important, SyntaxComment to Annotation) and anything with no fallback lands on
# the terminal default. Every meaning is set here, so none of that applies —
# it matters only if you delete a line.
#
# Values are `#rrggbb`. atuin also takes CSS colour names and `@`-prefixed
# crossterm names; hex is used for the same reason fish sets hex rather than
# ANSI names — the 16-colour table is on-scheme, but hex doesn't depend on it.
#
# The syntax slots mirror fish/config.fish's assignments for the same
# categories, so a command highlighted in the search UI is the colour it will
# be once it lands on the command line.
[colors]
Base       = "#{{base05-hex}}" # default text
Title      = "#{{base0D-hex}}" # the accent helix gives headings, zellij the active ribbon
Important  = "#{{base06-hex}}" # atuin's default is white+bold; base06 is the light end of the ramp
Muted      = "#{{base04-hex}}" # secondary text
Annotation = "#{{base03-hex}}" # comments, dim text
Guidance   = "#{{base0C-hex}}" # hints and key help

AlertInfo  = "#{{base0B-hex}}" # green,  matching atuin's DarkGreen default
AlertWarn  = "#{{base0A-hex}}" # yellow, matching DarkYellow
AlertError = "#{{base08-hex}}" # red,    matching DarkRed

SyntaxCommand  = "#{{base0D-hex}}" # fish_color_command
SyntaxFlag     = "#{{base0C-hex}}" # fish_color_option
SyntaxString   = "#{{base0B-hex}}" # fish_color_quote
SyntaxVariable = "#{{base0E-hex}}" # fish_color_keyword
SyntaxOperator = "#{{base0C-hex}}" # fish_color_operator
SyntaxComment  = "#{{base03-hex}}" # fish_color_comment
