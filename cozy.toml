name = "cozy"
description = "A cozy developer setup"

packages = [
  "fish",
  "starship",
  "zellij",
  "helix",
  "bat",
  "broot",
  "delta",
  "fd",
  "ripgrep",
  "eza",
  "git",
  "procs",
  "bottom",
  "glow",
  "zoxide",
  "claude-code",
  "fzf",
  "sd",
  "less",
  "coreutils",
  "inetutils",
  "iproute2",
  "procps-ng",
]

patches = [
    { dest = ".config/fish/config.fish",
      source = "~/.config/minimal/loadouts/cozy/fish/config.fish" },
    { dest = ".config/helix/config.toml",
      source = "~/.config/minimal/loadouts/cozy/helix/config.toml"},
    { dest = ".config/helix/languages.toml",
      source = "~/.config/minimal/loadouts/cozy/helix/languages.toml"},
    { dest = ".config/zellij/config.kdl",
      source = "~/.config/minimal/loadouts/cozy/zellij/config.kdl"},

    # Minimal base16 themes — see COLOURS.md
    { dest = ".config/helix/themes/minimal-dark.toml",
      source = "~/.config/minimal/loadouts/cozy/helix/themes/minimal-dark.toml"},
    { dest = ".config/helix/themes/minimal-light.toml",
      source = "~/.config/minimal/loadouts/cozy/helix/themes/minimal-light.toml"},
    { dest = ".config/zellij/themes/minimal.kdl",
      source = "~/.config/minimal/loadouts/cozy/zellij/themes/minimal.kdl"},

    # bat: themes plus the config that pins one. bat only sees the themes once
    # its cache is rebuilt — run `just bat-cache` after these land.
    { dest = ".config/bat/config",
      source = "~/.config/minimal/loadouts/cozy/bat/config"},
    { dest = ".config/bat/themes/minimal-dark.tmTheme",
      source = "~/.config/minimal/loadouts/cozy/bat/themes/minimal-dark.tmTheme"},
    { dest = ".config/bat/themes/minimal-light.tmTheme",
      source = "~/.config/minimal/loadouts/cozy/bat/themes/minimal-light.tmTheme"},

    # delta: an include, not a gitconfig. Wire it up with `just delta-include`.
    { dest = ".config/git/minimal-delta.gitconfig",
      source = "~/.config/minimal/loadouts/cozy/delta/minimal.gitconfig"},

    { dest = ".config/starship.toml",
      source = "~/.config/minimal/loadouts/cozy/starship/starship.toml"},

    { dest = ".config/broot/conf.hjson",
      source = "~/.config/minimal/loadouts/cozy/broot/conf.hjson"},
    { dest = ".config/broot/skins/minimal-dark.hjson",
      source = "~/.config/minimal/loadouts/cozy/broot/skins/minimal-dark.hjson"},
    { dest = ".config/broot/skins/minimal-light.hjson",
      source = "~/.config/minimal/loadouts/cozy/broot/skins/minimal-light.hjson"},

    # bottom has no variant switch of its own, so both files ship and the dark
    # one takes the default path.
    { dest = ".config/bottom/bottom.toml",
      source = "~/.config/minimal/loadouts/cozy/bottom/bottom.toml"},
    { dest = ".config/bottom/bottom-light.toml",
      source = "~/.config/minimal/loadouts/cozy/bottom/bottom-light.toml"},
]

[vars]
SHELL     = "fish"
EDITOR    = "hx"
PAGER     = "bat"
# Shell palette variant (dark|light). Only fish reads this — helix and zellij
# pin their variant in their own configs. See COLOURS.md.
MINIMAL_THEME = { inherit = true, default = "dark" }
