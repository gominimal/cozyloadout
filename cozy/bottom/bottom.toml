# bottom — Minimal Dark (see COLOURS.md).
#
# Only [styles] is set here, so bottom's layout, refresh rate and widget
# defaults are untouched — this is a colour scheme, not a configuration.
#
# bottom has no palette indirection and no light/dark switch of its own, so the
# light variant is a second whole file: cozy/bottom/bottom-light.toml, deployed
# alongside this one at ~/.config/bottom/bottom-light.toml. Use it ad hoc with
#
#     btm -C ~/.config/bottom/bottom-light.toml
#
# or make it the default by pointing the .config/bottom/bottom.toml patch in
# cozy.toml at it instead.
#
# Note that bottom names these keys with British spellings internally — its
# error messages say `border_colour` where the config key is `border_color`.
# Both spellings are accepted; `color` is used here to match bottom's docs.

# --- Chrome ------------------------------------------------------------------
[styles.widgets]
border_color = "#3d3d3d"                                    # base02 — --border
selected_border_color = "#4a7aff"                           # base0D — focused widget, as in zellij's frame_selected
widget_title = { color = "#e0e0e0", bold = true }           # base05
text = { color = "#e0e0e0" }                                # base05
selected_text = { color = "#141414", bg_color = "#4a7aff" } # base00 on base0D
disabled_text = { color = "#666666" }                       # base03
thread_text = { color = "#8f8f8f" }                         # base04

[styles.tables]
headers = { color = "#4a7aff", bold = true }                # base0D — matches zellij's table_title

[styles.graphs]
graph_color = "#3d3d3d"                                     # base02 — axes and grid
legend_text = { color = "#8f8f8f" }                         # base04

# --- CPU ---------------------------------------------------------------------
[styles.cpu]
all_entry_color = "#e0e0e0"                                 # base05
avg_entry_color = "#e93535"                                 # base08
# Per-core series. Same order as zellij's multiplayer_user_colors, so a machine
# with many cores cycles through the accents in a familiar sequence.
cpu_core_colors = [
  "#4a7aff", # base0D
  "#7ec897", # base0B
  "#dd8440", # base09
  "#aa81da", # base0E
  "#6bbec7", # base0C
  "#cca300", # base0A
  "#e93535", # base08
  "#af715a", # base0F
]

# --- Memory ------------------------------------------------------------------
[styles.memory]
ram_color = "#4a7aff"                                       # base0D
cache_color = "#aa81da"                                     # base0E
swap_color = "#dd8440"                                      # base09
arc_color = "#6bbec7"                                       # base0C
gpu_colors = [
  "#7ec897", # base0B
  "#cca300", # base0A
  "#e93535", # base08
  "#af715a", # base0F
]

# --- Network -----------------------------------------------------------------
[styles.network]
rx_color = "#7ec897"                                        # base0B — incoming
tx_color = "#4a7aff"                                        # base0D — outgoing
rx_total_color = "#6bbec7"                                  # base0C
tx_total_color = "#aa81da"                                  # base0E

# --- Gauges ------------------------------------------------------------------
[styles.battery]
high_battery_color = "#7ec897"                              # base0B — --success
medium_battery_color = "#cca300"                            # base0A
low_battery_color = "#e93535"                               # base08 — --error

[styles.temp_graph]
# Cool → hot, walking the same green/yellow/orange/red accents broot's
# good_to_bad ramp uses.
temp_graph_color_styles = [
  "#7ec897", # base0B
  "#cca300", # base0A
  "#dd8440", # base09
  "#e93535", # base08
]
