# bottom — Minimal Light (see COLOURS.md).
#
# Only [styles] is set here, so bottom's layout, refresh rate and widget
# defaults are untouched — this is a colour scheme, not a configuration.
#
# bottom has no palette indirection and no light/dark switch of its own, so each
# variant is a whole file. This one is not the default; the dark variant lands
# at ~/.config/bottom/bottom.toml and this lands beside it. Use it ad hoc with
#
#     btm -C ~/.config/bottom/bottom-light.toml
#
# or make it the default by pointing the .config/bottom/bottom.toml patch in
# cozy.toml at cozy/bottom/bottom-light.toml instead.
#
# Note that bottom names these keys with British spellings internally — its
# error messages say `border_colour` where the config key is `border_color`.
# Both spellings are accepted; `color` is used here to match bottom's docs.

# --- Chrome ------------------------------------------------------------------
[styles.widgets]
border_color = "#cccccc"                                    # base02 — --border
selected_border_color = "#2850bd"                           # base0D — focused widget, as in zellij's frame_selected
widget_title = { color = "#141414", bold = true }           # base05
text = { color = "#141414" }                                # base05
selected_text = { color = "#f5f5f5", bg_color = "#2850bd" } # base00 on base0D
disabled_text = { color = "#666666" }                       # base03
thread_text = { color = "#3d3d3d" }                         # base04

[styles.tables]
headers = { color = "#2850bd", bold = true }                # base0D — matches zellij's table_title

[styles.graphs]
graph_color = "#cccccc"                                     # base02 — axes and grid
legend_text = { color = "#3d3d3d" }                         # base04

# --- CPU ---------------------------------------------------------------------
[styles.cpu]
all_entry_color = "#141414"                                 # base05
avg_entry_color = "#b81414"                                 # base08
# Per-core series. Same order as zellij's multiplayer_user_colors, so a machine
# with many cores cycles through the accents in a familiar sequence.
cpu_core_colors = [
  "#2850bd", # base0D
  "#317247", # base0B
  "#8b4a18", # base09
  "#7743b1", # base0E
  "#2d6f76", # base0C
  "#7a6200", # base0A
  "#b81414", # base08
  "#754938", # base0F
]

# --- Memory ------------------------------------------------------------------
[styles.memory]
ram_color = "#2850bd"                                       # base0D
cache_color = "#7743b1"                                     # base0E
swap_color = "#8b4a18"                                      # base09
arc_color = "#2d6f76"                                       # base0C
gpu_colors = [
  "#317247", # base0B
  "#7a6200", # base0A
  "#b81414", # base08
  "#754938", # base0F
]

# --- Network -----------------------------------------------------------------
[styles.network]
rx_color = "#317247"                                        # base0B — incoming
tx_color = "#2850bd"                                        # base0D — outgoing
rx_total_color = "#2d6f76"                                  # base0C
tx_total_color = "#7743b1"                                  # base0E

# --- Gauges ------------------------------------------------------------------
[styles.battery]
high_battery_color = "#317247"                              # base0B — --success
medium_battery_color = "#7a6200"                            # base0A
low_battery_color = "#b81414"                               # base08 — --error

[styles.temp_graph]
# Cool → hot, walking the same green/yellow/orange/red accents broot's
# good_to_bad ramp uses.
temp_graph_color_styles = [
  "#317247", # base0B
  "#7a6200", # base0A
  "#8b4a18", # base09
  "#b81414", # base08
]
