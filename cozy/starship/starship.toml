# starship — Minimal base16 (see COLOURS.md).
#
# This file only restyles starship; it deliberately does not set `format`, so
# the prompt keeps starship's default shape and module set. Every module that
# ships a coloured default is reassigned to a base16 slot here, so nothing is
# left tracking the terminal emulator's own 16-colour table — the same reasoning
# behind fish setting hex explicitly.
#
# Switch the whole prompt by pointing `palette` at "minimal_light", the way
# helix and zellij pin their variant.
#
# Slot names are lowercase here (base0a, not base0A as in the helix themes and
# the YAML): starship lowercases a style string before looking it up in the
# palette, so an uppercase palette key can never be referenced and the module
# silently renders unstyled.
#
# Slot conventions used below:
#   base0d blue   — where you are (directory, containers, C-family)
#   base0a yellow — VCS branch, packaging, types-ish tooling
#   base09 orange — VCS state, clouds, "something is in progress"
#   base08 red    — errors, root, dirty worktree, JVM/Ruby family
#   base0b green  — success, JS/green-field runtimes
#   base0c cyan   — identity, orchestration, ML/systems runtimes
#   base0e purple — shells, functional languages, IaC
#   base0f brown  — the leftovers that would otherwise collide

palette = "minimal_dark"

# --- Palettes ----------------------------------------------------------------
[palettes.minimal_dark]
base00 = "#141414" # gray-8        — --background
base01 = "#292929" # gray-16       — --card
base02 = "#3d3d3d" # gray-24       — --border
base03 = "#666666" # gray-40       — --outline
base04 = "#8f8f8f" # gray-56       — --muted-foreground
base05 = "#e0e0e0" # gray-88       — --foreground
base06 = "#ebebeb" # gray-92
base07 = "#ffffff" # gray-100-dark
base08 = "#e93535" # red-56        — --error
base09 = "#dd8440" # orange-56     — derived
base0a = "#cca300" # yellow-40
base0b = "#7ec897" # green-64      — --success
base0c = "#6bbec7" # cyan-60       — derived
base0d = "#4a7aff" # blue-56       — --info
base0e = "#aa81da" # purple-68     — derived
base0f = "#af715a" # brown-52      — derived

[palettes.minimal_light]
base00 = "#f5f5f5" # gray-96-light — --background
base01 = "#ebebeb" # gray-92-light
base02 = "#cccccc" # gray-80-light
base03 = "#666666" # gray-40       — --muted-foreground
base04 = "#3d3d3d" # gray-24
base05 = "#141414" # gray-8        — --foreground
base06 = "#0a0a0a" # derived
base07 = "#000000" # derived
base08 = "#b81414" # red-40
base09 = "#8b4a18" # orange-32     — derived
base0a = "#7a6200" # yellow-24
base0b = "#317247" # green-32      — derived
base0c = "#2d6f76" # cyan-32       — derived
base0d = "#2850bd" # blue-45       — derived
base0e = "#7743b1" # purple-48     — derived
base0f = "#754938" # brown-34      — derived

# --- Prompt character --------------------------------------------------------
[character]
success_symbol = "[❯](bold base0b)"
error_symbol = "[❯](bold base08)"
vimcmd_symbol = "[❮](bold base0e)"
vimcmd_replace_one_symbol = "[❮](bold base0e)"
vimcmd_replace_symbol = "[❮](bold base0e)"
vimcmd_visual_symbol = "[❮](bold base0a)"

# --- Location ----------------------------------------------------------------
[directory]
style = "bold base0d"
read_only_style = "base08"
repo_root_style = "bold base0d"

[shlvl]
style = "bold base0a"

[fill]
style = "base02"

# --- Identity ----------------------------------------------------------------
